
<!DOCTYPE html>
<html lang="en">
<head>

<title>VOICE FAX - REAL AUDIO ACOUSTIC COUPLER</title>

<style>
*,*::before,*::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body {
  background:#fff;
  color:#000;
  font-family:"Courier New",Courier,monospace;

}

.app {
  max-width:640px;
  margin:0 auto;

header {
  border-top:3px solid #000;
  border-bottom:3px solid #000;

}

h1 {

}

}

.mode-bar {
  display:grid;
  grid-template-columns:1fr 1fr;
  border:2px solid #000;

}

  font-family:"Courier New",monospace;
  font-size:13px;
  font-weight:700;
  letter-spacing:.1em;

  background:#fff;
  color:#000;

}

button:hover:not(:disabled) {

.mode-bar button+button {

  background:#000;

}

.panel {
  display:none;

}

.panel.active {
  display:block;
}

.box {
  border:2px solid #000;

}

.row {
  display:flex;
  justify-content:space-between;

textarea {
  width:100%;
  min-height:120px;

canvas.page-canvas {
  display:block;

canvas.sketch-canvas {

.actions {

}

.actions button {

}

.actions .primary {

}

.actions .primary:hover:not(:disabled) {

}

.status {
  border:2px solid #000;

.status-line {

.paper-label {

@media(max-width:420px) {
  h1 {font-size:23px;}

}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>VOICE FAX</h1>
  <div class="sub">REAL ACOUSTIC MODEM</div>
</header>

<div class="mode-bar" role="tablist">
  <button id="tabSend" class="active" type="button">SEND</button>
  <button id="tabReceive" type="button">RECEIVE</button>
</div>

<!-- SEND -->

<section id="sendPanel" class="panel active">

  <div class="box">
    <div class="row">
      <span style="font-weight:700;">SHORT MESSAGE TO FAX</span>
      <button id="clearSketch" type="button"
        style="padding:4px 8px;font-size:10px;">
        CLEAR DRAWING
      </button>
    </div>

    <textarea id="faxText"
      maxlength="500"
      placeholder="TYPE SHORT TEXT TO TRANSMIT VIA AUDIO..."></textarea>

    <div style="margin-top:10px;" class="meta">
      OR DRAW BELOW:
    </div>

    <canvas id="sketchPad"
      class="sketch-canvas"
      width="256"
      height="128"></canvas>
  </div>

  <div class="actions">
    <button id="sendAudioBtn" class="primary" type="button">
      TRANSMIT AUDIO FAX
    </button>
  </div>

  <div class="status" id="sendStatus">
    <div class="status-line">READY</div>
    <div class="meta" id="sendDetail">
      ENTER TEXT OR DRAW, TURN UP SPEAKERS, AND TAP TRANSMIT.
    </div>
    <div class="progress" id="sendProgress">
      <div class="progress-fill" id="sendProgressFill"></div>
    </div>
  </div>

</section>

<!-- RECEIVE -->

<section id="receivePanel" class="panel">

  <div class="actions">
    <button id="listenMicBtn" class="primary" type="button">
      LISTEN VIA MICROPHONE
    </button>
    <button id="stopMicBtn" type="button" disabled>
      STOP LISTENING
    </button>
  </div>

  <div class="status" id="recvStatus">
    <div class="status-line">IDLE</div>
    <div class="meta" id="recvDetail">
      TAP LISTEN, ALLOW MIC, AND HOLD SPEAKER NEAR MIC TO HEAR/DECODE FAX.
    </div>
    <div class="progress" id="recvProgress">
      <div class="progress-fill" id="recvProgressFill"></div>
    </div>
  </div>

  <div class="paper-roll">
    <div class="paper-label">THERMAL PAPER PRINTER</div>
    <canvas id="recvCanvas"
      class="page-canvas"
      width="256"
      height="128"></canvas>
  </div>

</section>
</div>

<script>
(() => {
"use strict";

// ==========================================
// VOICE FAX CONFIGURATION
// ==========================================

const W = 256;
const H = 128;

const SYMBOL_MS = 40;
const SYMBOL_TIME = SYMBOL_MS / 1000;

const MAX_PAYLOAD = 30000;

// Four-frequency modulation.
// Each tone represents two bits.

const FREQS = [
  1200,
  1800,
  2400,
  3000
];

const CNG_FREQ = 800;

const PREAMBLE = Array.from(
  {length:32},
  (_,i) => i % 4
);

const MAGIC = [0xD3,0x91];

// ==========================================
// ELEMENTS
// ==========================================

const $ = id => document.getElementById(id);

const tabSend = $("tabSend");
const tabReceive = $("tabReceive");

const sendPanel = $("sendPanel");
const receivePanel = $("receivePanel");

const faxText = $("faxText");
const sketchPad = $("sketchPad");
const sketchCtx = sketchPad.getContext("2d");

const recvCanvas = $("recvCanvas");
const recvCtx = recvCanvas.getContext("2d");

const sendAudioBtn = $("sendAudioBtn");
const listenMicBtn = $("listenMicBtn");
const stopMicBtn = $("stopMicBtn");

const sendStatus = $("sendStatus");
const sendDetail = $("sendDetail");

const recvStatus = $("recvStatus");
const recvDetail = $("recvDetail");

let audioCtx = null;
let micStream = null;
let micAnalyser = null;
let micSource = null;

let isListening = false;
let isSending = false;

// ==========================================
// CANVAS INITIALIZATION
// ==========================================

function clearCanvas(ctx) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);
}

clearCanvas(sketchCtx);
clearCanvas(recvCtx);

// ==========================================
// TAB SWITCHING
// ==========================================

tabSend.addEventListener("click",() => {
  tabSend.classList.add("active");
  tabReceive.classList.remove("active");

  sendPanel.classList.add("active");
  receivePanel.classList.remove("active");
});

tabReceive.addEventListener("click",() => {
  tabReceive.classList.add("active");
  tabSend.classList.remove("active");

  receivePanel.classList.add("active");
  sendPanel.classList.remove("active");
});

// ==========================================
// DRAWING
// ==========================================

let drawing = false;

function pointerPosition(e) {
  const rect = sketchPad.getBoundingClientRect();

  return {
    x:(e.clientX-rect.left)*W/rect.width,
    y:(e.clientY-rect.top)*H/rect.height
  };
}

sketchPad.addEventListener("pointerdown",e => {
  drawing = true;

  sketchPad.setPointerCapture(e.pointerId);

  const p = pointerPosition(e);

  sketchCtx.beginPath();
  sketchCtx.moveTo(p.x,p.y);
});

sketchPad.addEventListener("pointermove",e => {
  if(!drawing) return;

  const p = pointerPosition(e);

  sketchCtx.lineTo(p.x,p.y);
  sketchCtx.strokeStyle = "#000";
  sketchCtx.lineWidth = 2;
  sketchCtx.lineCap = "round";
  sketchCtx.lineJoin = "round";
  sketchCtx.stroke();
});

sketchPad.addEventListener("pointerup",() => {
  drawing = false;
});

sketchPad.addEventListener("pointercancel",() => {
  drawing = false;
});

$("clearSketch").addEventListener("click",() => {
  clearCanvas(sketchCtx);
});

// ==========================================
// CREATE IMAGE
// ==========================================

function createFaxImage() {
  const canvas = document.createElement("canvas");

  canvas.width = W;
  canvas.height = H;

  const ctx = canvas.getContext("2d");

  clearCanvas(ctx);

  const text = faxText.value.trim();

  if(text) {
    ctx.fillStyle = "#000";
    ctx.font = '12px "Courier New", monospace';

    const maxChars = 34;
    const words = text.split(/\s+/);
    const lines = [];

    let line = "";

    for(const word of words) {
      const test = line ? line+" "+word : word;

      if(test.length > maxChars && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }

    if(line) lines.push(line);

    lines.slice(0,8).forEach((l,i) => {
      ctx.fillText(l,8,18+i*15);
    });

  } else {
    ctx.drawImage(sketchPad,0,0,W,H);
  }

  return canvas;
}

// ==========================================
// PNG ENCODING
// ==========================================

async function canvasToBytes(canvas) {
  const blob = await new Promise((resolve,reject) => {
    canvas.toBlob(b => {
      if(b) resolve(b);
      else reject(new Error("IMAGE ENCODING FAILED"));
    },"image/png");
  });

  return new Uint8Array(await blob.arrayBuffer());
}

// ==========================================
// CRC16 ERROR CHECKING
// ==========================================

function crc16(data) {
  let crc = 0xFFFF;

  for(const byte of data) {
    crc ^= byte;

    for(let i=0;i<8;i++) {
      if(crc & 1) {
        crc = (crc >>> 1)^0xA001;
      } else {
        crc >>>= 1;
      }
    }
  }

  return crc & 0xFFFF;
}

// ==========================================
// PACKET CREATION
// ==========================================

function createPacket(payload) {
  const header = new Uint8Array([
    MAGIC[0],
    MAGIC[1],
    (payload.length >>> 24)&255,
    (payload.length >>> 16)&255,
    (payload.length >>> 8)&255,
    payload.length&255
  ]);

  const body = new Uint8Array(
    header.length+payload.length
  );

  body.set(header,0);
  body.set(payload,header.length);

  const checksum = crc16(body);

  const packet = new Uint8Array(body.length+2);

  packet.set(body);

  packet[body.length] = checksum & 255;
  packet[body.length+1] = checksum >>> 8;

  return packet;
}

// ==========================================
// BYTES TO 4-FSK SYMBOLS
// ==========================================

function bytesToSymbols(bytes) {
  const symbols = [];

  for(const byte of bytes) {
    symbols.push((byte >>> 6)&3);
    symbols.push((byte >>> 4)&3);
    symbols.push((byte >>> 2)&3);
    symbols.push(byte&3);
  }

  return symbols;
}

// ==========================================
// AUDIO GENERATION
// ==========================================

function appendTone(samples,frequency,duration,sampleRate) {
  const count = Math.floor(duration*sampleRate);

  for(let i=0;i<count;i++) {
    const t = i/sampleRate;

    const ramp = Math.min(
      1,
      i/(sampleRate*0.003),
      (count-i)/(sampleRate*0.003)
    );

    samples.push(
      Math.sin(2*Math.PI*frequency*t)*0.35*Math.max(0,ramp)
    );
  }
}

function appendSilence(samples,duration,sampleRate) {
  const count = Math.floor(duration*sampleRate);

  for(let i=0;i<count;i++) {
    samples.push(0);
  }
}

function generateAudio(packet,sampleRate) {
  const samples = [];

  // Calling tone
  appendTone(samples,CNG_FREQ,0.8,sampleRate);

  // Synchronization gap
  appendSilence(samples,0.3,sampleRate);

  // Preamble
  for(const symbol of PREAMBLE) {
    appendTone(
      samples,
      FREQS[symbol],
      SYMBOL_TIME,
      sampleRate
    );
  }

  // Actual data
  const symbols = bytesToSymbols(packet);

  for(const symbol of symbols) {
    appendTone(
      samples,
      FREQS[symbol],
      SYMBOL_TIME,
      sampleRate
    );
  }

  // End silence
  appendSilence(samples,0.3,sampleRate);

  return new Float32Array(samples);
}

// ==========================================
// AUDIO PLAYBACK
// ==========================================

async function initializeAudio() {
  if(!audioCtx) {
    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if(audioCtx.state === "suspended") {
    await audioCtx.resume();
  }

  return audioCtx;
}

async function playAudio(samples) {
  await initializeAudio();

  const buffer = audioCtx.createBuffer(
    1,
    samples.length,
    audioCtx.sampleRate
  );

  buffer.copyToChannel(samples,0);

  const source = audioCtx.createBufferSource();

  source.buffer = buffer;
  source.connect(audioCtx.destination);

  await new Promise((resolve,reject) => {
    source.onended = resolve;

    try {
      source.start();
    } catch(err) {
      reject(err);
    }
  });
}

// ==========================================
// SEND FAX
// ==========================================

sendAudioBtn.addEventListener("click",async () => {
  if(isSending) return;

  isSending = true;
  sendAudioBtn.disabled = true;

  const progress = $("sendProgress");
  const progressFill = $("sendProgressFill");

  progress.style.display = "block";
  progressFill.style.width = "0%";

  try {
    sendStatus.querySelector(".status-line").textContent =
      "ENCODING IMAGE";

    sendDetail.textContent =
      "CONVERTING IMAGE TO PNG DATA...";

    const canvas = createFaxImage();

    const payload = await canvasToBytes(canvas);

    if(payload.length > MAX_PAYLOAD) {
      throw new Error("IMAGE TOO LARGE TO TRANSMIT.");
    }

    const packet = createPacket(payload);

    sendStatus.querySelector(".status-line").textContent =
      "PREPARING TRANSMISSION";

    sendDetail.textContent =
      `PACKET SIZE: ${packet.length} BYTES.`;

    await initializeAudio();

    const samples = generateAudio(
      packet,
      audioCtx.sampleRate
    );

    const duration = samples.length/audioCtx.sampleRate;

    sendStatus.querySelector(".status-line").textContent =
      "TRANSMITTING AUDIO";

    sendDetail.textContent =
      `SENDING ${packet.length} BYTES. KEEP DEVICES CLOSE TOGETHER.`;

    const start = performance.now();

    const progressTimer = setInterval(() => {
      const elapsed = (performance.now()-start)/1000;

      const percent = Math.min(
        99,
        elapsed/duration*100
      );

      progressFill.style.width = percent+"%";
    },100);

    try {
      await playAudio(samples);
    } finally {
      clearInterval(progressTimer);
    }

    progressFill.style.width = "100%";

    sendStatus.querySelector(".status-line").textContent =
      "TRANSMISSION COMPLETE";

    sendDetail.textContent =
      `SUCCESSFULLY PLAYED ${packet.length} BYTES OF AUDIO DATA.`;

  } catch(err) {
    sendStatus.querySelector(".status-line").textContent =
      "TRANSMISSION ERROR";

    sendDetail.textContent = err.message;

  } finally {
    isSending = false;
    sendAudioBtn.disabled = false;
  }
});

// ==========================================
// MICROPHONE SETUP
// ==========================================

async function startMicrophone() {
  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia) {
    throw new Error(
      "MICROPHONE REQUIRES HTTPS OR LOCALHOST."
    );
  }

  await initializeAudio();

  micStream = await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:false,
      noiseSuppression:false,
      autoGainControl:false
    }
  });

  micSource = audioCtx.createMediaStreamSource(micStream);

  micAnalyser = audioCtx.createAnalyser();

  micAnalyser.fftSize = 512;
  micAnalyser.smoothingTimeConstant = 0;

  micSource.connect(micAnalyser);
}

function stopMicrophone() {
  isListening = false;

  if(micSource) {
    micSource.disconnect();
    micSource = null;
  }

  if(micStream) {
    micStream.getTracks().forEach(track => track.stop());
    micStream = null;
  }

  micAnalyser = null;

  listenMicBtn.disabled = false;
  stopMicBtn.disabled = true;
}

// ==========================================
// FREQUENCY DETECTION
// ==========================================

const frequencyData = new Float32Array(257);

function getFrequencyLevel(frequency) {
  if(!micAnalyser) return -Infinity;

  micAnalyser.getFloatFrequencyData(frequencyData);

  const bin = Math.round(
    frequency*micAnalyser.fftSize/audioCtx.sampleRate
  );

  let peak = -Infinity;

  for(let i=-1;i<=1;i++) {
    const value = frequencyData[bin+i] ?? -Infinity;
    peak = Math.max(peak,value);
  }

  return peak;
}

function detectDataSymbol() {
  let bestSymbol = -1;
  let bestLevel = -Infinity;

  for(let i=0;i<FREQS.length;i++) {
    const level = getFrequencyLevel(FREQS[i]);

    if(level > bestLevel) {
      bestLevel = level;
      bestSymbol = i;
    }
  }

  if(bestLevel < -55) return -1;

  return bestSymbol;
}

// ==========================================
// WAIT UTILITIES
// ==========================================

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve,ms));
}

function checkListening() {
  if(!isListening) {
    throw new Error("RECEPTION STOPPED.");
  }
}

// ==========================================
// DETECT CALLING TONE
// ==========================================

async function waitForCallingTone() {
  let detectedTime = 0;

  recvDetail.textContent =
    "WAITING FOR INCOMING CALLING TONE...";

  while(isListening) {
    const level = getFrequencyLevel(CNG_FREQ);

    if(level > -55) {
      detectedTime += 20;

      if(detectedTime >= 160) {
        recvDetail.textContent =
          "CALLING TONE DETECTED. WAITING FOR DATA...";
        break;
      }

    } else {
      detectedTime = 0;
    }

    await sleep(20);
  }

  checkListening();

  // Wait for the end of the calling tone.
  let silenceTime = 0;

  while(isListening) {
    const level = getFrequencyLevel(CNG_FREQ);

    if(level < -55) {
      silenceTime += 20;

      if(silenceTime >= 80) break;

    } else {
      silenceTime = 0;
    }

    await sleep(20);
  }

  checkListening();

  // Sender's synchronization gap.
  await sleep(300+SYMBOL_MS/2);

  checkListening();
}

// ==========================================
// READ ONE SYMBOL
// ==========================================

async function readSymbol() {
  checkListening();

  const symbol = detectDataSymbol();

  await sleep(SYMBOL_MS);

  checkListening();

  if(symbol < 0) {
    throw new Error("SIGNAL LOST. TRY AGAIN.");
  }

  return symbol;
}

// ==========================================
// READ BYTES
// ==========================================

async function readBytes(count,progressStart,progressEnd) {
  const bytes = new Uint8Array(count);

  for(let i=0;i<count;i++) {
    let value = 0;

    for(let j=0;j<4;j++) {
      const symbol = await readSymbol();

      value = (value<<2)|symbol;
    }

    bytes[i] = value;

    if(i%16===0 || i===count-1) {
      const percent = progressStart+
        (i+1)/count*(progressEnd-progressStart);

      $("recvProgressFill").style.width =
        percent+"%";
    }
  }

  return bytes;
}

// ==========================================
// RECEIVE PACKET
// ==========================================

async function receivePacket() {
  await waitForCallingTone();

  recvStatus.querySelector(".status-line").textContent =
    "SYNCHRONIZING";

  // Verify the preamble.
  for(let i=0;i<PREAMBLE.length;i++) {
    const symbol = await readSymbol();

    if(symbol !== PREAMBLE[i]) {
      throw new Error(
        "SYNCHRONIZATION FAILED. CHECK AUDIO LEVELS."
      );
    }
  }

  recvStatus.querySelector(".status-line").textContent =
    "RECEIVING DATA";

  recvDetail.textContent =
    "MODEM SYNCHRONIZED. READING PACKET HEADER...";

  // Header: magic + 32-bit payload length.
  const header = await readBytes(6,0,10);

  if(header[0] !== MAGIC[0] ||
     header[1] !== MAGIC[1]) {
    throw new Error("INVALID PACKET HEADER.");
  }

  const length =
    header[2]*16777216+
    header[3]*65536+
    header[4]*256+
    header[5];

  if(!Number.isSafeInteger(length) ||
     length < 1 ||
     length > MAX_PAYLOAD) {
    throw new Error("INVALID IMAGE SIZE.");
  }

  recvDetail.textContent =
    `RECEIVING IMAGE DATA: ${length} BYTES.`;

  const payload = await readBytes(length,10,95);

  recvDetail.textContent =
    "CHECKING TRANSMISSION INTEGRITY...";

  const checksumBytes = await readBytes(2,95,100);

  const packetBody = new Uint8Array(6+payload.length);

  packetBody.set(header);
  packetBody.set(payload,6);

  const receivedCRC =
    checksumBytes[0]|(checksumBytes[1]<<8);

  const calculatedCRC = crc16(packetBody);

  if(receivedCRC !== calculatedCRC) {
    throw new Error(
      "CHECKSUM ERROR. RECEIVED IMAGE MAY BE CORRUPTED."
    );
  }

  return payload;
}

// ==========================================
// RECONSTRUCT RECEIVED IMAGE
// ==========================================

async function printReceivedImage(bytes) {
  const blob = new Blob(
    [bytes],
    {type:"image/png"}
  );

  const bitmap = await createImageBitmap(blob);

  clearCanvas(recvCtx);

  recvCtx.drawImage(
    bitmap,
    0,
    0,
    W,
    H
  );

  bitmap.close();
}

// ==========================================
// START RECEIVING
// ==========================================

listenMicBtn.addEventListener("click",async () => {
  if(isListening) return;

  listenMicBtn.disabled = true;
  stopMicBtn.disabled = false;

  $("recvProgress").style.display = "block";
  $("recvProgressFill").style.width = "0%";

  recvStatus.querySelector(".status-line").textContent =
    "INITIALIZING";

  recvDetail.textContent =
    "REQUESTING MICROPHONE ACCESS...";

  try {
    await startMicrophone();

    isListening = true;

    recvStatus.querySelector(".status-line").textContent =
      "LISTENING";

    const payload = await receivePacket();

    checkListening();

    recvStatus.querySelector(".status-line").textContent =
      "PRINTING IMAGE";

    recvDetail.textContent =
      "TRANSMISSION VERIFIED. RECONSTRUCTING IMAGE...";

    await printReceivedImage(payload);

    stopMicrophone();

    recvStatus.querySelector(".status-line").textContent =
      "FAX RECEIVED";

    recvDetail.textContent =
      `SUCCESSFULLY RECEIVED AND VERIFIED ${payload.length} BYTES.`;

  } catch(err) {
    stopMicrophone();

    recvStatus.querySelector(".status-line").textContent =
      "RECEPTION ERROR";

    recvDetail.textContent = err.message;
  }
});

// ==========================================
// STOP RECEIVING
// ==========================================

stopMicBtn.addEventListener("click",() => {
  stopMicrophone();

  recvStatus.querySelector(".status-line").textContent =
    "STOPPED";

  recvDetail.textContent =
    "MICROPHONE LISTENING STOPPED.";
});

})();
</script>
</body>
</html>
