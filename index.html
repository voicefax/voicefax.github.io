
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">

<title>VoiceFax | Acoustic Data Transmission</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="machine">

<header>
    <h1>VOICEFAX</h1>
    <p>ACOUSTIC DATA TRANSMISSION SYSTEM</p>
    <div class="version">VF MODEM SYSTEM / VERSION 2.0</div>
</header>

<section class="screen">

    <div class="screen-heading">
        SYSTEM STATUS
        <span id="connectionStatus">OFFLINE</span>
    </div>

    <div id="mainStatus">READY</div>

    <div id="statusMessage">
        Awaiting transmission.
    </div>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>

    <div id="progressText">0%</div>

</section>

<section>

    <h2>01 / DOCUMENT INPUT</h2>

    <label class="upload" for="fileInput">
        SELECT DOCUMENT
    </label>

    <input
        type="file"
        id="fileInput"
        accept=".txt,.pdf,.jpg,.jpeg,.png,.webp"
    >

    <div id="fileName">NO FILE SELECTED</div>

    <textarea
        id="documentText"
        placeholder="Document contents..."
    ></textarea>

</section>

<section>

    <h2>02 / MODEM CONFIGURATION</h2>

    <label for="modemSpeed">TRANSMISSION SPEED</label>

    <select id="modemSpeed">
        <option value="5">5 baud - VERY SLOW</option>
        <option value="10" selected>10 baud - SLOW</option>
        <option value="20">20 baud - NORMAL</option>
    </select>

    <label for="frequency">AUDIO FREQUENCY</label>

    <select id="frequency">
        <option value="1000">1000 Hz</option>
        <option value="1200" selected>1200 Hz</option>
        <option value="1500">1500 Hz</option>
    </select>

</section>

<section>

    <h2>03 / TRANSMISSION</h2>

    <button id="prepareButton">
        ENCODE DOCUMENT
    </button>

    <button id="transmitButton" disabled>
        START TRANSMISSION
    </button>

    <button id="pauseButton" disabled>
        PAUSE
    </button>

    <button id="stopButton" disabled>
        STOP
    </button>

</section>

<section>

    <h2>04 / RECEIVER</h2>

    <button id="receiveButton">
        ENABLE AUDIO RECEIVER
    </button>

    <button id="decodeButton" disabled>
        DECODE RECEIVED DATA
    </button>

    <textarea
        id="receivedText"
        placeholder="Received document will appear here..."
        readonly
    ></textarea>

</section>

<footer>
    VOICEFAX TELECOMMUNICATIONS<br>
    ACOUSTIC DATA TRANSFER<br>
    END OF SYSTEM
</footer>

</main>

<script src="script.js"></script>

</body>
</html>
