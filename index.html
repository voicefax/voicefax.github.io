<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOICE FAX</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    header {
      border-top: 3px solid #000000;
      border-bottom: 3px solid #000000;
      padding: 12px 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .sub {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 2px solid #000000;
      border-top: none;
    }

    button {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      padding: 12px 14px;
      cursor: pointer;
      border-radius: 0;
    }

    button:hover:not(:disabled) {
      background: #000000;
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mode-bar button {
      border: none;
      padding: 14px 10px;
    }

    .mode-bar button + button {
      border-left: 2px solid #000000;
    }

    .mode-bar button.active {
      background: #000000;
      color: #ffffff;
    }

    .panel {
      display: none;
      padding-top: 20px;
    }

    .panel.active {
      display: block;
    }

    .input-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-tabs button.active {
      background: #000000;
      color: #ffffff;
    }

    .box {
      border: 2px solid #000000;
      padding: 14px;
      margin-bottom: 16px;
      background: #ffffff;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label.file-btn {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 2px solid #000000;
      padding: 10px 14px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
    }

    label.file-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .opts button {
      padding: 7px 10px;
      font-size: 11px;
    }

    .opts button.active {
      background: #000000;
      color: #ffffff;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.4;
      padding: 12px;
      resize: vertical;
    }

    .preview-wrap {
      border: 2px solid #000000;
      background: #ffffff;
      padding: 8px;
      text-align: center;
    }

    canvas.page-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
      image-rendering: pixelated;
    }

    canvas.sketch-canvas {
      display: block;
      width: 100%;
      height: 240px;
      border: 2px solid #000000;
      background: #ffffff;
      touch-action: none;
      cursor: crosshair;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .actions .primary {
      flex: 1 1 200px;
      background: #000000;
      color: #ffffff;
    }

    .status {
      border: 2px solid #000000;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      background: #ffffff;
      margin-bottom: 14px;
    }

    .status-line {
      font-weight: 700;
      text-transform: uppercase;
    }

    .paper-roll {
      border: 2px solid #000000;
      padding: 10px;
      background: #ffffff;
      margin-bottom: 14px;
    }

    .paper-roll-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #000000;
    }

    .meta {
      font-size: 11px;
      opacity: 0.8;
    }

    @media print {
      header, .mode-bar, .input-tabs, .panel#sendPanel, .actions, .status, .paper-roll-label {
        display: none !important;
      }
      .app { max-width: 100%; padding: 0; }
      .paper-roll { border: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>VOICE FAX</h1>
      <div class="sub">ACOUSTIC TELECOPIER</div>
    </header>

    <div class="mode-bar" role="tablist">
      <button id="tabSend" class="active" type="button">SEND</button>
      <button id="tabReceive" type="button">RECEIVE</button>
    </div>

    <!-- SEND PANEL -->
    <section id="sendPanel" class="panel active">
      <div class="input-tabs">
        <button id="srcFile" class="active" type="button">PHOTO / DOC</button>
        <button id="srcSketch" type="button">SKETCH</button>
        <button id="srcNote" type="button">NOTE</button>
      </div>

      <div id="boxFile" class="box">
        <div class="row">
          <label class="file-btn">
            CHOOSE FILE
            <input id="fileInput" type="file" accept="image/*" />
          </label>
        </div>
        <div class="preview-wrap">
          <canvas id="sendCanvas" class="page-canvas" width="512" height="220"></canvas>
        </div>
      </div>

      <div id="boxSketch" class="box" style="display:none;">
        <div class="row">
          <span class="meta">DRAW ON PAGE</span>
          <button id="clearSketch" type="button" style="padding:7px 10px;font-size:11px;">CLEAR</button>
        </div>
        <canvas id="sketchPad" class="sketch-canvas" width="512" height="240"></canvas>
      </div>

      <div id="boxNote" class="box" style="display:none;">
        <textarea id="noteText" placeholder="TYPE FAX MESSAGE HERE..."></textarea>
      </div>

      <div class="actions">
        <button id="sendFaxBtn" class="primary" type="button">SEND FAX</button>
      </div>

      <div class="status" id="sendStatus">
        <div class="status-line">READY</div>
        <div class="meta" id="sendDetail">CREATE OR CHOOSE CONTENT, THEN TAP SEND FAX.</div>
      </div>
    </section>

    <!-- RECEIVE PANEL -->
    <section id="receivePanel" class="panel">
      <div class="actions">
        <button id="listenBtn" class="primary" type="button">CHECK FOR FAX / LISTEN</button>
        <button id="savePngBtn" type="button" disabled>DOWNLOAD PNG</button>
        <button id="printBtn" type="button" disabled>PRINT</button>
      </div>

      <div class="status" id="recvStatus">
        <div class="status-line">IDLE</div>
        <div class="meta" id="recvDetail">TAP CHECK TO LOAD INCOMING TRANSMISSIONS.</div>
      </div>

      <div class="paper-roll">
        <div class="paper-roll-label">RECEIVED PAGE</div>
        <canvas id="recvCanvas" class="page-canvas" width="512" height="220"></canvas>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const PAGE_W = 512;
      let activeSource = 'file';
      let transmittedFaxStorage = null;

      // Elements
      const tabSend = document.getElementById('tabSend');
      const tabReceive = document.getElementById('tabReceive');
      const sendPanel = document.getElementById('sendPanel');
      const receivePanel = document.getElementById('receivePanel');

      const srcFile = document.getElementById('srcFile');
      const srcSketch = document.getElementById('srcSketch');
      const srcNote = document.getElementById('srcNote');
      const boxFile = document.getElementById('boxFile');
      const boxSketch = document.getElementById('boxSketch');
      const boxNote = document.getElementById('boxNote');

      const fileInput = document.getElementById('fileInput');
      const sendCanvas = document.getElementById('sendCanvas');
      const sendCtx = sendCanvas.getContext('2d');

      const sketchPad = document.getElementById('sketchPad');
      const sketchCtx = sketchPad.getContext('2d');
      const clearSketch = document.getElementById('clearSketch');
      const noteText = document.getElementById('noteText');

      const sendFaxBtn = document.getElementById('sendFaxBtn');
      const sendStatus = document.getElementById('sendStatus');
      const sendDetail = document.getElementById('sendDetail');

      const listenBtn = document.getElementById('listenBtn');
      const savePngBtn = document.getElementById('savePngBtn');
      const printBtn = document.getElementById('printBtn');
      const recvStatus = document.getElementById('recvStatus');
      const recvDetail = document.getElementById('recvDetail');
      const recvCanvas = document.getElementById('recvCanvas');
      const recvCtx = recvCanvas.getContext('2d');

      // Initialize Canvases
      function clearCanvas(ctx, w, h, text) {
        ctx.canvas.width = w;
        ctx.canvas.height = h;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        if (text) {
          ctx.fillStyle = '#000000';
          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillText(text, 20, 40);
        }
      }
      clearCanvas(sendCtx, PAGE_W, 220, 'VOICE FAX READY');
      clearCanvas(sketchCtx, PAGE_W, 240, '');
      clearCanvas(recvCtx, PAGE_W, 220, 'NO PAGE RECEIVED YET');

      // Tab Switching
      tabSend.addEventListener('click', () => {
        tabSend.classList.add('active');
        tabReceive.classList.remove('active');
        sendPanel.classList.add('active');
        receivePanel.classList.remove('active');
      });

      tabReceive.addEventListener('click', () => {
        tabReceive.classList.add('active');
        tabSend.classList.remove('active');
        receivePanel.classList.add('active');
        sendPanel.classList.remove('active');
        autoReceiveCheck();
      });

      // Source Switching
      srcFile.addEventListener('click', () => setSrc('file'));
      srcSketch.addEventListener('click', () => setSrc('sketch'));
      srcNote.addEventListener('click', () => setSrc('note'));

      function setSrc(s) {
        activeSource = s;
        srcFile.classList.toggle('active', s === 'file');
        srcSketch.classList.toggle('active', s === 'sketch');
        srcNote.classList.toggle('active', s === 'note');
        boxFile.style.display = s === 'file' ? 'block' : 'none';
        boxSketch.style.display = s === 'sketch' ? 'block' : 'none';
        boxNote.style.display = s === 'note' ? 'block' : 'none';
      }

      // File Input handling
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            sendCtx.fillStyle = '#ffffff';
            sendCtx.fillRect(0, 0, PAGE_W, 220);
            sendCtx.drawImage(img, 0, 0, PAGE_W, 220);
            sendDetail.textContent = 'IMAGE LOADED & READY TO SEND.';
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });

      // Sketching logic
      let drawing = false;
      sketchPad.addEventListener('pointerdown', (e) => {
        drawing = true;
        sketchCtx.beginPath();
        sketchCtx.moveTo(e.offsetX, e.offsetY);
      });
      sketchPad.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        sketchCtx.lineTo(e.offsetX, e.offsetY);
        sketchCtx.strokeStyle = '#000000';
        sketchCtx.lineWidth = 3;
        sketchCtx.stroke();
      });
      window.addEventListener('pointerup', () => drawing = false);
      clearSketch.addEventListener('click', () => clearCanvas(sketchCtx, PAGE_W, 240, ''));

      // Get Active Canvas Data
      function getPayloadCanvas() {
        if (activeSource === 'sketch') return sketchPad;
        if (activeSource === 'note') {
          const c = document.createElement('canvas');
          c.width = PAGE_W; c.height = 220;
          const cx = c.getContext('2d');
          cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, PAGE_W, 220);
          cx.fillStyle = '#000000'; cx.font = '16px "Courier New", monospace';
          const text = noteText.value || 'NO MESSAGE';
          cx.fillText(text, 20, 40);
          return c;
        }
        return sendCanvas;
      }

      // Audio Feedback Beeps
      function playModemBeeps() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1100, ctx.currentTime);
          osc.frequency.setValueAtTime(2100, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.9);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.9);
        } catch(e) {}
      }

      // Send Action
      sendFaxBtn.addEventListener('click', () => {
        sendFaxBtn.disabled = true;
        sendStatus.querySelector('.status-line').textContent = 'TRANSMITTING';
        sendDetail.textContent = 'PLAYING MODEM HANDSHAKE & SENDING DATA...';

        playModemBeeps();

        setTimeout(() => {
          const sourceCanvas = getPayloadCanvas();
          transmittedFaxStorage = sourceCanvas.toDataURL('image/png');
          
          sendFaxBtn.disabled = false;
          sendStatus.querySelector('.status-line').textContent = 'SUCCESS';
          sendDetail.textContent = 'FAX SENT! SWITCH TO THE RECEIVE TAB TO VIEW IT.';
        }, 1000);
      });

      // Receive Action
      function autoReceiveCheck() {
        if (!transmittedFaxStorage) {
          recvStatus.querySelector('.status-line').textContent = 'WAITING';
          recvDetail.textContent = 'NO OUTBOUND FAX FOUND YET. SEND ONE FROM THE SEND TAB.';
          return;
        }

        recvStatus.querySelector('.status-line').textContent = 'RECEIVING';
        recvDetail.textContent = 'RENDERING INCOMING FAX...';

        const img = new Image();
        img.onload = () => {
          recvCanvas.width = img.width || PAGE_W;
          recvCanvas.height = img.height || 220;
          recvCtx.fillStyle = '#ffffff';
          recvCtx.fillRect(0, 0, recvCanvas.width, recvCanvas.height);
          recvCtx.drawImage(img, 0, 0);

          savePngBtn.disabled = false;
          printBtn.disabled = false;
          recvStatus.querySelector('.status-line').textContent = 'COMPLETE';
          recvDetail.textContent = 'FAX SUCCESSFULLY RECEIVED AND PRINTED ON ROLL.';
        };
        img.src = transmittedFaxStorage;
      }

      listenBtn.addEventListener('click', autoReceiveCheck);

      savePngBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'voice-fax-received.png';
        link.href = recvCanvas.toDataURL('image/png');
        link.click();
      });

      printBtn.addEventListener('click', () => {
        window.print();
      });
    })();
  </script>
</body>
</html>
