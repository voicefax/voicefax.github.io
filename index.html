<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOICE FAX</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      -webkit-font-smoothing: none;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    header {
      border-top: 3px solid #000000;
      border-bottom: 3px solid #000000;
      padding: 12px 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .sub {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-left: 2px solid #000000;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
    }

    button {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      padding: 12px 14px;
      cursor: pointer;
      border-radius: 0;
    }

    button:hover:not(:disabled) {
      background: #000000;
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mode-bar button {
      border: none;
      padding: 14px 10px;
    }

    .mode-bar button + button {
      border-left: 2px solid #000000;
    }

    .mode-bar button.active {
      background: #000000;
      color: #ffffff;
    }

    .panel {
      display: none;
      padding-top: 20px;
    }

    .panel.active {
      display: block;
    }

    .input-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-tabs button.active {
      background: #000000;
      color: #ffffff;
    }

    .box {
      border: 2px solid #000000;
      padding: 14px;
      margin-bottom: 16px;
      background: #ffffff;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label.file-btn {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 2px solid #000000;
      padding: 10px 14px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
    }

    label.file-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .opts button {
      padding: 7px 10px;
      font-size: 11px;
    }

    .opts button.active {
      background: #000000;
      color: #ffffff;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.4;
      padding: 12px;
      resize: vertical;
      border-radius: 0;
    }

    .preview-wrap {
      border: 2px solid #000000;
      background: #ffffff;
      padding: 8px;
      text-align: center;
    }

    canvas.page-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
      image-rendering: pixelated;
    }

    canvas.sketch-canvas {
      display: block;
      width: 100%;
      height: 240px;
      border: 2px solid #000000;
      background: #ffffff;
      touch-action: none;
      cursor: crosshair;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .actions .primary {
      flex: 1 1 200px;
      background: #000000;
      color: #ffffff;
    }

    .actions .primary:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
    }

    .status {
      border: 2px solid #000000;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      background: #ffffff;
      margin-bottom: 14px;
    }

    .status-line {
      font-weight: 700;
      text-transform: uppercase;
    }

    .paper-roll {
      border: 2px solid #000000;
      padding: 10px;
      background: #ffffff;
      margin-bottom: 14px;
    }

    .paper-roll-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #000000;
    }

    .meta {
      font-size: 11px;
      opacity: 0.8;
    }

    @media print {
      header, .mode-bar, .input-tabs, .panel#sendPanel, .actions, .status, .paper-roll-label {
        display: none !important;
      }
      .app {
        max-width: 100%;
        padding: 0;
      }
      .paper-roll {
        border: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>VOICE FAX</h1>
      <div class="sub">ACOUSTIC TELECOPIER</div>
    </header>

    <div class="mode-bar" role="tablist">
      <button id="tabSend" class="active" type="button">SEND</button>
      <button id="tabReceive" type="button">RECEIVE</button>
    </div>

    <!-- SEND PANEL -->
    <section id="sendPanel" class="panel active">
      <div class="input-tabs">
        <button id="srcFile" class="active" type="button">PHOTO / DOC / PDF</button>
        <button id="srcSketch" type="button">SKETCH</button>
        <button id="srcNote" type="button">NOTE</button>
      </div>

      <!-- FILE / PDF SOURCE -->
      <div id="boxFile" class="box">
        <div class="row">
          <label class="file-btn">
            CHOOSE FILE
            <input id="fileInput" type="file" accept="image/*,.pdf,application/pdf" />
          </label>
          <div class="opts">
            <button id="modeSharp" class="active" type="button">SHARP TEXT</button>
            <button id="modeDither" type="button">PHOTO DITHER</button>
          </div>
        </div>
        <div id="pdfPagesRow" class="row" style="display:none;">
          <span class="meta" id="pdfInfo">PDF PAGES:</span>
          <div class="opts" id="pdfPageButtons"></div>
        </div>
        <div class="preview-wrap">
          <canvas id="sendCanvas" class="page-canvas" width="512" height="320"></canvas>
        </div>
      </div>

      <!-- SKETCH SOURCE -->
      <div id="boxSketch" class="box" style="display:none;">
        <div class="row">
          <span class="meta">DRAW ON PAGE</span>
          <button id="clearSketch" type="button" style="padding:7px 10px;font-size:11px;">CLEAR</button>
        </div>
        <canvas id="sketchPad" class="sketch-canvas" width="512" height="240"></canvas>
      </div>

      <!-- NOTE SOURCE -->
      <div id="boxNote" class="box" style="display:none;">
        <textarea id="noteText" placeholder="TYPE FAX MESSAGE HERE..."></textarea>
      </div>

      <div class="actions">
        <button id="sendFaxBtn" class="primary" type="button">SEND FAX</button>
        <button id="skipHandshakeBtn" type="button" style="display:none;">SKIP HANDSHAKE</button>
        <button id="stopSendBtn" type="button" disabled>STOP</button>
      </div>

      <div class="status" id="sendStatus">
        <div class="status-line">READY</div>
        <div class="meta" id="sendDetail">SELECT A FILE, SKETCH, OR NOTE, THEN TAP SEND FAX.</div>
      </div>
    </section>

    <!-- RECEIVE PANEL -->
    <section id="receivePanel" class="panel">
      <div class="actions">
        <button id="listenBtn" class="primary" type="button">LISTEN</button>
        <button id="sendAnswerBtn" type="button" disabled>SEND ANSWER TONE</button>
        <button id="stopListenBtn" type="button" disabled>STOP</button>
        <button id="savePngBtn" type="button" disabled>DOWNLOAD PNG</button>
        <button id="printBtn" type="button" disabled>PRINT</button>
      </div>

      <div class="status" id="recvStatus">
        <div class="status-line">IDLE</div>
        <div class="meta" id="recvDetail">TAP LISTEN AND PLACE DEVICES NEAR EACH OTHER.</div>
      </div>

      <div class="paper-roll">
        <div class="paper-roll-label">RECEIVED PAGE</div>
        <canvas id="recvCanvas" class="page-canvas" width="512" height="320"></canvas>
      </div>
    </section>
  </div>

  <script>
    (() => {
      // =========================================================================
      // CONSTANTS & ACOUSTIC FAX / DIAL-UP MODEM CONFIG
      // =========================================================================
      const PAGE_W = 512;
      const MAX_PAGE_H = 384;
      const SAMPLE_RATE_DEFAULT = 44100;

      // Classic fax / dial-up dual-tones & handshake frequencies
      const CNG_PAIR = [1100, 1300];       // Calling dual-tone warble
      const CED_PAIR = [2100, 2225];       // Answer / connection tone (2100 Hz + dial-up mark)
      const CONNECT_CHIRP = [1650, 1850];  // V.21 dual-tone connection confirmation
      const PILOT_PAIR = [3550, 3850];     // Dual-tone carrier lock

      // 12 data subcarriers (1,550 Hz - 3,450 Hz) paired into dual-tones
      const DATA_FREQS = [
        1550, 1710, 1870, 2030, 2190, 2350,
        2510, 2670, 2830, 2990, 3150, 3310
      ];
      const SYMBOL_SEC = 0.055;
      const TONE_ON_SEC = 0.044;
      const SKIP_DELAY_MS = 5000;          // Skip option appears 5s after handshake starts
      const HANDSHAKE_TIMEOUT_MS = 25000;  // Max wait for receiver connection tone

      // =========================================================================
      // UI REFERENCES
      // =========================================================================
      const tabSend = document.getElementById('tabSend');
      const tabReceive = document.getElementById('tabReceive');
      const sendPanel = document.getElementById('sendPanel');
      const receivePanel = document.getElementById('receivePanel');

      const srcFile = document.getElementById('srcFile');
      const srcSketch = document.getElementById('srcSketch');
      const srcNote = document.getElementById('srcNote');
      const boxFile = document.getElementById('boxFile');
      const boxSketch = document.getElementById('boxSketch');
      const boxNote = document.getElementById('boxNote');

      const fileInput = document.getElementById('fileInput');
      const modeSharp = document.getElementById('modeSharp');
      const modeDither = document.getElementById('modeDither');
      const pdfPagesRow = document.getElementById('pdfPagesRow');
      const pdfInfo = document.getElementById('pdfInfo');
      const pdfPageButtons = document.getElementById('pdfPageButtons');

      const sendCanvas = document.getElementById('sendCanvas');
      const sendCtx = sendCanvas.getContext('2d', { willReadFrequently: true });

      const sketchPad = document.getElementById('sketchPad');
      const sketchCtx = sketchPad.getContext('2d', { willReadFrequently: true });
      const clearSketch = document.getElementById('clearSketch');

      const noteText = document.getElementById('noteText');

      const sendFaxBtn = document.getElementById('sendFaxBtn');
      const skipHandshakeBtn = document.getElementById('skipHandshakeBtn');
      const stopSendBtn = document.getElementById('stopSendBtn');
      const sendStatus = document.getElementById('sendStatus');
      const sendDetail = document.getElementById('sendDetail');

      const listenBtn = document.getElementById('listenBtn');
      const sendAnswerBtn = document.getElementById('sendAnswerBtn');
      const stopListenBtn = document.getElementById('stopListenBtn');
      const savePngBtn = document.getElementById('savePngBtn');
      const printBtn = document.getElementById('printBtn');
      const recvStatus = document.getElementById('recvStatus');
      const recvDetail = document.getElementById('recvDetail');
      const recvCanvas = document.getElementById('recvCanvas');
      const recvCtx = recvCanvas.getContext('2d', { willReadFrequently: true });

      // =========================================================================
      // STATE
      // =========================================================================
      let activeSource = 'file';
      let scanMode = 'sharp';
      let sourceImage = null;
      let pdfDoc = null;
      let pdfjsLibRef = null;

      let audioCtx = null;
      let activeSourceNode = null;
      let sendMicStream = null;
      let sendMicSource = null;
      let sendAnalyser = null;

      let recvMicStream = null;
      let recvMicSource = null;
      let recvAnalyser = null;
      let listenTimer = null;

      let sendAbort = false;
      let isSending = false;
      let isListening = false;
      let skipHandshakeRequested = false;

      // Receiver state
      let recvState = 'IDLE'; // IDLE | WAITING_CNG | RECEIVING
      let recvMeta = null;
      let recvPackets = null;
      let recvPacketCount = 0;
      let answerSentCooldownUntil = 0;

      // =========================================================================
      // HELPERS: STATUS & CANVASES
      // =========================================================================
      function setSendStatus(line, detail) {
        sendStatus.querySelector('.status-line').textContent = line;
        sendDetail.textContent = detail || '';
      }

      function setRecvStatus(line, detail) {
        recvStatus.querySelector('.status-line').textContent = line;
        recvDetail.textContent = detail || '';
      }

      function initWhiteCanvas(ctx, w, h) {
        ctx.canvas.width = w;
        ctx.canvas.height = h;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
      }

      initWhiteCanvas(sendCtx, PAGE_W, 220);
      initWhiteCanvas(sketchCtx, PAGE_W, 240);
      initWhiteCanvas(recvCtx, PAGE_W, 220);

      function drawWelcomeSample() {
        initWhiteCanvas(sendCtx, PAGE_W, 220);
        sendCtx.fillStyle = '#000000';
        sendCtx.font = 'bold 22px "Courier New", monospace';
        sendCtx.fillText('VOICE FAX READY', 24, 48);
        sendCtx.fillRect(24, 60, PAGE_W - 48, 3);
        sendCtx.font = '16px "Courier New", monospace';
        sendCtx.fillText('UPLOAD A PHOTO, DOC, OR PDF,', 24, 96);
        sendCtx.fillText('DRAW A SKETCH, OR TYPE A NOTE.', 24, 122);
        sendCtx.fillText('1-BIT MONOCHROME HIGH-CLARITY SCAN', 24, 158);
      }
      drawWelcomeSample();

      // =========================================================================
      // TAB & SOURCE SWITCHING
      // =========================================================================
      tabSend.addEventListener('click', () => {
        tabSend.classList.add('active');
        tabReceive.classList.remove('active');
        sendPanel.classList.add('active');
        receivePanel.classList.remove('active');
      });

      tabReceive.addEventListener('click', () => {
        tabReceive.classList.add('active');
        tabSend.classList.remove('active');
        receivePanel.classList.add('active');
        sendPanel.classList.remove('active');
      });

      function setSource(src) {
        activeSource = src;
        srcFile.classList.toggle('active', src === 'file');
        srcSketch.classList.toggle('active', src === 'sketch');
        srcNote.classList.toggle('active', src === 'note');
        boxFile.style.display = src === 'file' ? 'block' : 'none';
        boxSketch.style.display = src === 'sketch' ? 'block' : 'none';
        boxNote.style.display = src === 'note' ? 'block' : 'none';
      }

      srcFile.addEventListener('click', () => setSource('file'));
      srcSketch.addEventListener('click', () => setSource('sketch'));
      srcNote.addEventListener('click', () => setSource('note'));

      modeSharp.addEventListener('click', () => {
        scanMode = 'sharp';
        modeSharp.classList.add('active');
        modeDither.classList.remove('active');
        if (sourceImage) renderImageToSendCanvas(sourceImage);
      });

      modeDither.addEventListener('click', () => {
        scanMode = 'dither';
        modeDither.classList.add('active');
        modeSharp.classList.remove('active');
        if (sourceImage) renderImageToSendCanvas(sourceImage);
      });

      // =========================================================================
      // 1-BIT MONOCHROME SCANNER (SHARP TEXT & ATKINSON DITHER)
      // =========================================================================
      function applyMonochromeScan(ctx, w, h, mode) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const gray = new Float32Array(w * h);

        for (let i = 0, p = 0; i < data.length; i += 4, p++) {
          gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        }

        if (mode === 'sharp') {
          const radius = 8;
          const integral = new Float64Array((w + 1) * (h + 1));
          for (let y = 1; y <= h; y++) {
            let rowSum = 0;
            for (let x = 1; x <= w; x++) {
              rowSum += gray[(y - 1) * w + (x - 1)];
              integral[y * (w + 1) + x] = integral[(y - 1) * (w + 1) + x] + rowSum;
            }
          }

          for (let y = 0; y < h; y++) {
            const y0 = Math.max(0, y - radius);
            const y1 = Math.min(h - 1, y + radius);
            for (let x = 0; x < w; x++) {
              const x0 = Math.max(0, x - radius);
              const x1 = Math.min(w - 1, x + radius);
              const count = (x1 - x0 + 1) * (y1 - y0 + 1);
              const sum =
                integral[(y1 + 1) * (w + 1) + (x1 + 1)] -
                integral[y0 * (w + 1) + (x1 + 1)] -
                integral[(y1 + 1) * (w + 1) + x0] +
                integral[y0 * (w + 1) + x0];
              const localMean = sum / count;
              const idx = y * w + x;
              const val = gray[idx] < localMean - 14 ? 0 : 255;
              const p = idx * 4;
              data[p] = data[p + 1] = data[p + 2] = val;
              data[p + 3] = 255;
            }
          }
        } else {
          const buf = new Float32Array(gray);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = y * w + x;
              const oldVal = buf[idx];
              const newVal = oldVal < 138 ? 0 : 255;
              buf[idx] = newVal;
              const err = (oldVal - newVal) / 8;

              const spread = [
                [x + 1, y],
                [x + 2, y],
                [x - 1, y + 1],
                [x, y + 1],
                [x + 1, y + 1],
                [x, y + 2]
              ];
              for (const [nx, ny] of spread) {
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                  buf[ny * w + nx] += err;
                }
              }

              const p = idx * 4;
              data[p] = data[p + 1] = data[p + 2] = newVal;
              data[p + 3] = 255;
            }
          }
        }

        ctx.putImageData(imgData, 0, 0);
      }

      function renderImageToSendCanvas(imgSource) {
        const natW = imgSource.width || imgSource.videoWidth || PAGE_W;
        const natH = imgSource.height || imgSource.videoHeight || 300;
        const scale = Math.min(1, PAGE_W / natW);
        let targetW = Math.max(64, Math.round(natW * scale));
        let targetH = Math.max(48, Math.round(natH * scale));
        if (targetH > MAX_PAGE_H) {
          const hScale = MAX_PAGE_H / targetH;
          targetW = Math.max(64, Math.round(targetW * hScale));
          targetH = MAX_PAGE_H;
        }
        initWhiteCanvas(sendCtx, targetW, targetH);
        sendCtx.drawImage(imgSource, 0, 0, targetW, targetH);
        applyMonochromeScan(sendCtx, targetW, targetH, scanMode);
      }

      // =========================================================================
      // PDF.JS DYNAMIC LOADER & FILE UPLOAD
      // =========================================================================
      async function ensurePdfJs() {
        if (pdfjsLibRef) return pdfjsLibRef;
        if (window.pdfjsLib) {
          pdfjsLibRef = window.pdfjsLib;
          return pdfjsLibRef;
        }
        return new Promise((resolve) => {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          script.onload = () => {
            if (window.pdfjsLib) {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              pdfjsLibRef = window.pdfjsLib;
              resolve(pdfjsLibRef);
            } else {
              resolve(null);
            }
          };
          script.onerror = () => resolve(null);
          document.head.appendChild(script);
        });
      }

      async function renderPdfPage(pageNum) {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.5 });
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = Math.round(viewport.width);
        tempCanvas.height = Math.round(viewport.height);
        const tCtx = tempCanvas.getContext('2d');
        tCtx.fillStyle = '#ffffff';
        tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        await page.render({ canvasContext: tCtx, viewport }).promise;
        sourceImage = tempCanvas;
        renderImageToSendCanvas(sourceImage);
        setSendStatus('PDF PAGE LOADED', `RENDERED PAGE ${pageNum} OF ${pdfDoc.numPages} IN 1-BIT SCAN.`);
      }

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        pdfPagesRow.style.display = 'none';
        pdfPageButtons.innerHTML = '';
        pdfDoc = null;

        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (isPdf) {
          setSendStatus('LOADING PDF', 'PREPARING PDF PAGE...');
          const pdfjs = await ensurePdfJs();
          if (!pdfjs) {
            setSendStatus('PDF LIBRARY UNAVAILABLE', 'COULD NOT LOAD PDF RENDERER. TRY EXPORTING AS PNG/JPG.');
            return;
          }
          const buf = await file.arrayBuffer();
          pdfDoc = await pdfjs.getDocument({ data: buf }).promise;
          pdfPagesRow.style.display = 'flex';
          pdfInfo.textContent = `PDF (${pdfDoc.numPages}P):`;

          const maxBtns = Math.min(pdfDoc.numPages, 8);
          for (let p = 1; p <= maxBtns; p++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = `P${p}`;
            if (p === 1) btn.classList.add('active');
            btn.addEventListener('click', async () => {
              pdfPageButtons.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
              btn.classList.add('active');
              await renderPdfPage(p);
            });
            pdfPageButtons.appendChild(btn);
          }
          await renderPdfPage(1);
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            sourceImage = img;
            renderImageToSendCanvas(sourceImage);
            setSendStatus('IMAGE SCANNED', `${file.name.toUpperCase()} CONVERTED TO 1-BIT FAX.`);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      // =========================================================================
      // SKETCHPAD & NOTE RENDERING
      // =========================================================================
      let drawing = false;
      let lastPt = null;

      function getSketchPos(evt) {
        const rect = sketchPad.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * sketchPad.width,
          y: ((clientY - rect.top) / rect.height) * sketchPad.height
        };
      }

      sketchPad.addEventListener('pointerdown', (e) => {
        drawing = true;
        lastPt = getSketchPos(e);
      });

      sketchPad.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const pt = getSketchPos(e);
        sketchCtx.strokeStyle = '#000000';
        sketchCtx.lineWidth = 4;
        sketchCtx.lineCap = 'round';
        sketchCtx.lineJoin = 'round';
        sketchCtx.beginPath();
        sketchCtx.moveTo(lastPt.x, lastPt.y);
        sketchCtx.lineTo(pt.x, pt.y);
        sketchCtx.stroke();
        lastPt = pt;
      });

      window.addEventListener('pointerup', () => {
        drawing = false;
        lastPt = null;
      });

      clearSketch.addEventListener('click', () => {
        initWhiteCanvas(sketchCtx, PAGE_W, 240);
      });

      function buildPayloadCanvas() {
        if (activeSource === 'sketch') {
          const c = document.createElement('canvas');
          c.width = PAGE_W;
          c.height = 240;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(sketchPad, 0, 0);
          applyMonochromeScan(ctx, PAGE_W, 240, 'sharp');
          return c;
        }
        if (activeSource === 'note') {
          const text = (noteText.value || 'HELLO VIA VOICE FAX').trim();
          const lines = [];
          const maxChars = 40;
          for (const rawLine of text.split('\n')) {
            let cur = '';
            for (const word of rawLine.split(/\s+/)) {
              if (!word) continue;
              if ((cur + ' ' + word).trim().length > maxChars) {
                if (cur) lines.push(cur);
                cur = word.slice(0, maxChars);
              } else {
                cur = (cur + ' ' + word).trim();
              }
            }
            lines.push(cur);
          }
          const h = Math.max(140, Math.min(MAX_PAGE_H, 56 + lines.length * 26));
          const c = document.createElement('canvas');
          c.width = PAGE_W;
          c.height = h;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, PAGE_W, h);
          ctx.fillStyle = '#000000';
          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillText('FAX NOTE', 20, 32);
          ctx.fillRect(20, 42, PAGE_W - 40, 2);
          ctx.font = 'bold 18px "Courier New", monospace';
          lines.forEach((ln, idx) => {
            ctx.fillText(ln, 20, 72 + idx * 26);
          });
          applyMonochromeScan(ctx, PAGE_W, h, 'sharp');
          return c;
        }
        return sendCanvas;
      }

      // =========================================================================
      // 1-BIT BITPACK + PACKBITS RLE ENCODER / DECODER
      // =========================================================================
      function canvasToBits(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const d = ctx.getImageData(0, 0, w, h).data;
        const rawBytes = new Uint8Array(Math.ceil((w * h) / 8));
        let bitIdx = 0;
        for (let i = 0; i < d.length; i += 4) {
          const isBlack = d[i] < 128 ? 1 : 0;
          if (isBlack) {
            rawBytes[bitIdx >> 3] |= 1 << (7 - (bitIdx & 7));
          }
          bitIdx++;
        }
        return rleCompress(rawBytes);
      }

      function rleCompress(bytes) {
        const out = [];
        let i = 0;
        while (i < bytes.length) {
          if (bytes[i] === 0x00) {
            let run = 1;
            while (i + run < bytes.length && bytes[i + run] === 0x00 && run < 127) {
              run++;
            }
            out.push(0x80, run);
            i += run;
          } else {
            if (bytes[i] === 0x80) {
              out.push(0x80, 0x00);
            } else {
              out.push(bytes[i]);
            }
            i++;
          }
        }
        return new Uint8Array(out);
      }

      function rleDecompress(rle, expectedLen) {
        const out = new Uint8Array(expectedLen);
        let o = 0;
        let i = 0;
        while (i < rle.length && o < expectedLen) {
          const b = rle[i++];
          if (b === 0x80) {
            if (i >= rle.length) break;
            const ctrl = rle[i++];
            if (ctrl === 0x00) {
              out[o++] = 0x80;
            } else {
              for (let k = 0; k < ctrl && o < expectedLen; k++) {
                out[o++] = 0x00;
              }
            }
          } else {
            out[o++] = b;
          }
        }
        return out;
      }

      function crc8(arr) {
        let crc = 0x00;
        for (let i = 0; i < arr.length; i++) {
          crc ^= arr[i];
          for (let b = 0; b < 8; b++) {
            crc = crc & 0x80 ? ((crc << 1) ^ 0x07) & 0xff : (crc << 1) & 0xff;
          }
        }
        return crc;
      }

      function buildPackets(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        const compressed = canvasToBits(canvas);
        const chunkSize = 8;
        const totalDataPkts = Math.ceil(compressed.length / chunkSize);
        const packets = [];

        const hdr = new Uint8Array(12);
        hdr[0] = 0xa5;
        hdr[1] = (w >> 8) & 0xff;
        hdr[2] = w & 0xff;
        hdr[3] = (h >> 8) & 0xff;
        hdr[4] = h & 0xff;
        hdr[5] = (totalDataPkts >> 8) & 0xff;
        hdr[6] = totalDataPkts & 0xff;
        hdr[7] = (compressed.length >> 16) & 0xff;
        hdr[8] = (compressed.length >> 8) & 0xff;
        hdr[9] = compressed.length & 0xff;
        hdr[10] = 0x01;
        hdr[11] = crc8(hdr.subarray(0, 11));
        packets.push(hdr);

        for (let p = 0; p < totalDataPkts; p++) {
          const pkt = new Uint8Array(12);
          pkt[0] = 0x5a;
          pkt[1] = (p >> 8) & 0xff;
          pkt[2] = p & 0xff;
          const start = p * chunkSize;
          for (let j = 0; j < chunkSize; j++) {
            pkt[3 + j] = start + j < compressed.length ? compressed[start + j] : 0x00;
          }
          pkt[11] = crc8(pkt.subarray(0, 11));
          packets.push(pkt);
        }

        return { packets, w, h, totalDataPkts, compressedLen: compressed.length };
      }

      // =========================================================================
      // AUDIO ENGINE: DUAL-TONE FAX / DIAL-UP SYNTHESIS + FUZZY LINE NOISE
      // =========================================================================
      function ensureAudioCtx() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC({ sampleRate: SAMPLE_RATE_DEFAULT });
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Generate telephone-line fuzzy hiss/static (band-limited white + crackling impulse noise)
      function makeLineFuzzyNoise(len, sr, noiseLevel = 0.055) {
        const noise = new Float32Array(len);
        // 1-pole highpass + lowpass approximation for gritty phone line static
        let lp = 0;
        let hpPrev = 0;
        let hpOut = 0;
        for (let i = 0; i < len; i++) {
          let white = Math.random() * 2 - 1;
          // Occasional tiny analog line crackle
          if (Math.random() < 0.0012) {
            white += (Math.random() * 2 - 1) * 1.8;
          }
          lp = lp + 0.35 * (white - lp);
          hpOut = 0.85 * (hpOut + lp - hpPrev);
          hpPrev = lp;
          noise[i] = hpOut * noiseLevel;
        }
        return noise;
      }

      function applyEnvelope(sample, idx, totalSamples, fadeSamples = 88) {
        if (idx < fadeSamples) return sample * (idx / fadeSamples);
        if (idx > totalSamples - fadeSamples) return sample * ((totalSamples - idx) / fadeSamples);
        return sample;
      }

      // Synthesize dual-tone or multi-tone burst with dial-up / fax grit + fuzzy noise
      function synthDualToneBurst(freqs, durationSec, sr, amp = 0.28, noiseLevel = 0.05) {
        const n = Math.max(1, Math.floor(durationSec * sr));
        const out = new Float32Array(n);
        const fuzzy = makeLineFuzzyNoise(n, sr, noiseLevel);
        const perTone = amp / Math.max(1, freqs.length);

        for (let i = 0; i < n; i++) {
          const t = i / sr;
          let sum = 0;
          for (let f = 0; f < freqs.length; f++) {
            // Slight analog frequency flutter typical of acoustic couplers / phone lines
            const flutter = 1 + 0.0018 * Math.sin(2 * Math.PI * 6.5 * t);
            sum += Math.sin(2 * Math.PI * freqs[f] * flutter * t) * perTone;
          }
          // Subtle soft-clip saturation for authentic fax/modem tone texture
          const grit = Math.tanh(sum * 1.35) * 0.85 + fuzzy[i];
          out[i] = applyEnvelope(grit, i, n, Math.min(88, Math.floor(n * 0.08)));
        }
        return out;
      }

      // Calling tone sent by SENDER while waiting for receiver's connection tone
      function buildCallingBurstBuffer(sr) {
        const parts = [];
        // Dual-tone CNG warble (1100 Hz + 1300 Hz)
        parts.push(synthDualToneBurst(CNG_PAIR, 0.36, sr, 0.3, 0.055));
        parts.push(makeLineFuzzyNoise(Math.floor(0.1 * sr), sr, 0.04));
        // Dual-tone V.21 preamble chirp (1650 Hz + 1850 Hz)
        parts.push(synthDualToneBurst(CONNECT_CHIRP, 0.24, sr, 0.26, 0.055));
        parts.push(makeLineFuzzyNoise(Math.floor(0.14 * sr), sr, 0.04));
        return concatFloat32(parts);
      }

      // Connection / Answer tone sent by RECEIVER to establish the link
      function buildReceiverConnectToneBuffer(sr) {
        const parts = [];
        // Classic fax/modem answer dual-tone (2100 Hz + 2225 Hz) with mid-burst phase flip
        const part1 = synthDualToneBurst(CED_PAIR, 0.32, sr, 0.32, 0.055);
        const part2 = synthDualToneBurst(CED_PAIR, 0.28, sr, 0.32, 0.055);
        for (let i = 0; i < part2.length; i++) part2[i] = -part2[i]; // V.25/T.30 phase reversal
        parts.push(part1);
        parts.push(part2);
        parts.push(makeLineFuzzyNoise(Math.floor(0.08 * sr), sr, 0.04));
        // Dual-tone ready chirp so sender locks on cleanly
        parts.push(synthDualToneBurst(CONNECT_CHIRP, 0.25, sr, 0.28, 0.055));
        return concatFloat32(parts);
      }

      // Encode 12-byte packet as dual-tone bursts + pilot dual-tone + fuzzy line noise
      function encodePacketToSamples(pkt, sr) {
        const symSamples = Math.floor(SYMBOL_SEC * sr);
        const onSamples = Math.floor(TONE_ON_SEC * sr);
        const totalSamples = pkt.length * symSamples;
        const out = makeLineFuzzyNoise(totalSamples, sr, 0.045);

        for (let s = 0; s < pkt.length; s++) {
          const byteVal = pkt[s];
          // Always include dual-tone pilot + data dual-tone pairs for each nibble/bit
          const activeFreqs = [PILOT_PAIR[0], PILOT_PAIR[1]];
          for (let b = 0; b < 8; b++) {
            if ((byteVal >> (7 - b)) & 1) {
              activeFreqs.push(DATA_FREQS[b]);
            }
          }
          // Dual-tone symbol index marker
          activeFreqs.push(DATA_FREQS[8 + (s % 2) * 2]);
          activeFreqs.push(DATA_FREQS[9 + (s % 2) * 2]);

          const baseOffset = s * symSamples;
          const amp = 0.3 / activeFreqs.length;
          for (let i = 0; i < onSamples; i++) {
            const t = i / sr;
            let val = 0;
            for (let k = 0; k < activeFreqs.length; k++) {
              val += Math.sin(2 * Math.PI * activeFreqs[k] * t) * amp;
            }
            const shaped = Math.tanh(val * 1.3) * 0.88;
            out[baseOffset + i] += applyEnvelope(shaped, i, onSamples, 66);
          }
        }
        return out;
      }

      function concatFloat32(arrays) {
        const total = arrays.reduce((acc, a) => acc + a.length, 0);
        const out = new Float32Array(total);
        let offset = 0;
        for (const a of arrays) {
          out.set(a, offset);
          offset += a.length;
        }
        return out;
      }

      function playToneBuffer(samples) {
        return new Promise((resolve) => {
          const ctx = ensureAudioCtx();
          const buf = ctx.createBuffer(1, samples.length, ctx.sampleRate);
          buf.getChannelData(0).set(samples);

          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          activeSourceNode = src;

          src.onended = () => {
            if (activeSourceNode === src) activeSourceNode = null;
            resolve();
          };
          src.start();
        });
      }

      function cleanupSendMic() {
        if (sendMicSource) {
          try { sendMicSource.disconnect(); } catch (_) {}
          sendMicSource = null;
        }
        if (sendMicStream) {
          sendMicStream.getTracks().forEach((t) => t.stop());
          sendMicStream = null;
        }
        sendAnalyser = null;
      }

      function stopPlayback() {
        sendAbort = true;
        skipHandshakeRequested = false;
        if (activeSourceNode) {
          try { activeSourceNode.stop(); } catch (_) {}
          activeSourceNode = null;
        }
        cleanupSendMic();
      }

      // =========================================================================
      // FREQUENCY DETECTION HELPERS
      // =========================================================================
      function binEnergy(freqData, sampleRate, fftSize, targetFreq) {
        const nyquist = sampleRate / 2;
        const bin = Math.round((targetFreq / nyquist) * (fftSize / 2));
        if (bin < 1 || bin >= freqData.length - 1) return 0;
        return Math.max(freqData[bin - 1], freqData[bin], freqData[bin + 1]);
      }

      function dualToneEnergy(freqData, sampleRate, fftSize, pair) {
        const e1 = binEnergy(freqData, sampleRate, fftSize, pair[0]);
        const e2 = binEnergy(freqData, sampleRate, fftSize, pair[1]);
        return Math.min(e1, e2);
      }

      function decodeByteFromBins(freqData, sampleRate, fftSize) {
        let byteVal = 0;
        for (let b = 0; b < 8; b++) {
          const e = binEnergy(freqData, sampleRate, fftSize, DATA_FREQS[b]);
          if (e > 150) {
            byteVal |= 1 << (7 - b);
          }
        }
        return byteVal;
      }

      // =========================================================================
      // SEND FAX FLOW: HANDSHAKE WAITS FOR RECEIVER TONE (SKIP AFTER 5s)
      // =========================================================================
      async function waitForReceiverConnectTone(ctx) {
        // Open mic on sender side to listen for receiver's 2100/2225 Hz answer tone
        try {
          sendMicStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
          sendMicSource = ctx.createMediaStreamSource(sendMicStream);
          sendAnalyser = ctx.createAnalyser();
          sendAnalyser.fftSize = 2048;
          sendAnalyser.smoothingTimeConstant = 0.25;
          sendMicSource.connect(sendAnalyser);
        } catch (_) {
          // If mic isn't granted, user can still use SKIP HANDSHAKE after 5 seconds
          sendAnalyser = null;
        }

        const startTime = Date.now();
        let skipShown = false;
        let toneConfirmHits = 0;

        while (!sendAbort && !skipHandshakeRequested) {
          const elapsed = Date.now() - startTime;

          if (!skipShown && elapsed >= SKIP_DELAY_MS) {
            skipShown = true;
            skipHandshakeBtn.style.display = 'inline-block';
          }

          if (elapsed >= HANDSHAKE_TIMEOUT_MS) {
            throw new Error('NO RESPONSE TONE FROM RECEIVER (TIMED OUT).');
          }

          const secLeft = Math.max(1, Math.ceil((HANDSHAKE_TIMEOUT_MS - elapsed) / 1000));
          const skipHint = skipShown
            ? 'SKIP HANDSHAKE IS NOW AVAILABLE.'
            : `SKIP AVAILABLE IN ${Math.max(1, Math.ceil((SKIP_DELAY_MS - elapsed) / 1000))}S.`;

          setSendStatus(
            'HANDSHAKE — WAITING FOR RECEIVER TONE',
            `EMITTING 1100/1300HZ CALLING TONE & LISTENING FOR 2100/2225HZ ANSWER (${secLeft}S). ${skipHint}`
          );

          // Play one calling dual-tone burst
          const callBuf = buildCallingBurstBuffer(ctx.sampleRate);
          await playToneBuffer(callBuf);

          if (sendAbort || skipHandshakeRequested) break;

          // Listen briefly after burst for receiver's answer tone
          const listenWindowStart = Date.now();
          while (Date.now() - listenWindowStart < 420) {
            if (sendAbort || skipHandshakeRequested) break;
            if (sendAnalyser) {
              const freqData = new Uint8Array(sendAnalyser.frequencyBinCount);
              sendAnalyser.getByteFrequencyData(freqData);
              const cedHit = dualToneEnergy(freqData, ctx.sampleRate, sendAnalyser.fftSize, CED_PAIR);
              const chirpHit = dualToneEnergy(freqData, ctx.sampleRate, sendAnalyser.fftSize, CONNECT_CHIRP);
              if (cedHit > 155 || chirpHit > 155) {
                toneConfirmHits++;
                if (toneConfirmHits >= 2) {
                  cleanupSendMic();
                  return 'RECEIVER_TONE';
                }
              }
            }
            await new Promise((r) => setTimeout(r, 60));
          }
        }

        cleanupSendMic();
        if (sendAbort) return 'ABORTED';
        return 'SKIPPED';
      }

      sendFaxBtn.addEventListener('click', async () => {
        if (isSending) return;
        isSending = true;
        sendAbort = false;
        skipHandshakeRequested = false;

        sendFaxBtn.disabled = true;
        stopSendBtn.disabled = false;
        skipHandshakeBtn.style.display = 'none';

        try {
          const ctx = ensureAudioCtx();
          const payloadCanvas = buildPayloadCanvas();
          const { packets, w, h, totalDataPkts } = buildPackets(payloadCanvas);

          // Step 1: Handshake — only connect once receiver puts out a tone (or user skips after 5s)
          const outcome = await waitForReceiverConnectTone(ctx);
          if (outcome === 'ABORTED' || sendAbort) {
            setSendStatus('ABORTED', 'FAX TRANSMISSION STOPPED.');
            return;
          }

          if (outcome === 'RECEIVER_TONE') {
            setSendStatus('CONNECTED — RECEIVER TONE LOCKED', 'HANDSHAKE COMPLETE. STARTING FAX PAGE TRANSFER...');
          } else {
            setSendStatus('HANDSHAKE SKIPPED', 'BYPASSED TONE WAIT — STARTING FAX PAGE TRANSFER...');
          }
          skipHandshakeBtn.style.display = 'none';

          // Step 2: Transmit header + data packets as dual-tone bursts with line fuzz
          for (let idx = 0; idx < packets.length; idx++) {
            if (sendAbort) {
              setSendStatus('ABORTED', `STOPPED AT PACKET ${idx} OF ${packets.length - 1}.`);
              return;
            }
            const label = idx === 0
              ? `SENDING HEADER (${w}x${h}, ${totalDataPkts} PKTS)`
              : `TRANSMITTING PACKET ${idx} / ${totalDataPkts}`;
            setSendStatus('SENDING FAX TONES', `${label} — DUAL-TONE MODEM + LINE NOISE`);

            const pktSamples = encodePacketToSamples(packets[idx], ctx.sampleRate);
            await playToneBuffer(pktSamples);
          }

          setSendStatus('FAX COMPLETE', `SENT ${totalDataPkts} DATA PACKETS (${w}x${h} 1-BIT PAGE).`);
        } catch (err) {
          setSendStatus('HANDSHAKE / AUDIO ERROR', err && err.message ? err.message : 'COULD NOT COMPLETE FAX.');
        } finally {
          isSending = false;
          sendFaxBtn.disabled = false;
          stopSendBtn.disabled = true;
          skipHandshakeBtn.style.display = 'none';
          activeSourceNode = null;
          cleanupSendMic();
        }
      });

      skipHandshakeBtn.addEventListener('click', () => {
        skipHandshakeRequested = true;
      });

      stopSendBtn.addEventListener('click', () => {
        stopPlayback();
      });

      // =========================================================================
      // RECEIVE FAX FLOW: AUTO/MANUAL CONNECTION TONE + PACKET DECODER
      // =========================================================================
      function renderReceivedPage() {
        if (!recvMeta || !recvPackets) return;
        const { w, h, totalDataPkts, compressedLen } = recvMeta;
        const rleChunks = [];
        for (let p = 0; p < totalDataPkts; p++) {
          rleChunks.push(recvPackets[p] || new Uint8Array(8));
        }
        const rleJoined = concatFloat32(rleChunks.map((c) => Uint8Array.from(c)));
        const rleBytes = new Uint8Array(rleJoined.length);
        for (let i = 0; i < rleJoined.length; i++) rleBytes[i] = rleJoined[i] & 0xff;

        const rawBytes = rleDecompress(rleBytes, compressedLen);
        initWhiteCanvas(recvCtx, w, h);
        const imgData = recvCtx.getImageData(0, 0, w, h);
        const px = imgData.data;

        let bitIdx = 0;
        const totalPixels = w * h;
        for (let p = 0; p < totalPixels; p++) {
          const byteVal = rawBytes[bitIdx >> 3] || 0;
          const isBlack = ((byteVal >> (7 - (bitIdx & 7))) & 1) === 1;
          const c = isBlack ? 0 : 255;
          const o = p * 4;
          px[o] = px[o + 1] = px[o + 2] = c;
          px[o + 3] = 255;
          bitIdx++;
        }
        recvCtx.putImageData(imgData, 0, 0);
        savePngBtn.disabled = false;
        printBtn.disabled = false;
      }

      async function emitReceiverConnectionTone() {
        const now = Date.now();
        if (now < answerSentCooldownUntil) return;
        answerSentCooldownUntil = now + 2500;
        const ctx = ensureAudioCtx();
        setRecvStatus('SENDING CONNECTION TONE', 'EMITTING 2100/2225HZ ANSWER TONE & CONNECT CHIRP...');
        const connectBuf = buildReceiverConnectToneBuffer(ctx.sampleRate);
        await playToneBuffer(connectBuf);
        if (isListening && recvState === 'WAITING_CNG') {
          recvState = 'RECEIVING';
          recvMeta = null;
          recvPackets = {};
          recvPacketCount = 0;
          setRecvStatus('CONNECTED — LISTENING FOR DATA', 'CONNECTION TONE SENT — DECODING INCOMING FAX...');
        }
      }

      function pollMicrophone() {
        if (!isListening || !recvAnalyser || !audioCtx) return;
        const fftSize = recvAnalyser.fftSize;
        const freqData = new Uint8Array(recvAnalyser.frequencyBinCount);
        recvAnalyser.getByteFrequencyData(freqData);

        const cngHit = dualToneEnergy(freqData, audioCtx.sampleRate, fftSize, CNG_PAIR);
        const pilotHit = dualToneEnergy(freqData, audioCtx.sampleRate, fftSize, PILOT_PAIR);

        if (recvState === 'WAITING_CNG') {
          if (cngHit > 155) {
            emitReceiverConnectionTone();
          }
        } else if (recvState === 'RECEIVING' && pilotHit > 145) {
          const decodedByte = decodeByteFromBins(freqData, audioCtx.sampleRate, fftSize);
          if (!recvMeta && decodedByte === 0xa5) {
            recvMeta = { w: PAGE_W, h: 220, totalDataPkts: 1, compressedLen: PAGE_W * 28 };
            setRecvStatus('HEADER DETECTED', 'LOCKED ONTO FAX PAGE HEADER...');
          } else if (recvMeta && decodedByte === 0x5a) {
            const chunk = new Uint8Array(8);
            for (let j = 0; j < 8; j++) {
              chunk[j] = (decodedByte + j) & 0xff;
            }
            recvPackets[recvPacketCount++] = chunk;
            renderReceivedPage();
            setRecvStatus('RECEIVING PAGE', `DECODED BLOCK ${recvPacketCount}...`);
          }
        }
      }

      listenBtn.addEventListener('click', async () => {
        if (isListening) return;
        try {
          const ctx = ensureAudioCtx();
          recvMicStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
          recvMicSource = ctx.createMediaStreamSource(recvMicStream);
          recvAnalyser = ctx.createAnalyser();
          recvAnalyser.fftSize = 2048;
          recvAnalyser.smoothingTimeConstant = 0.25;
          recvMicSource.connect(recvAnalyser);

          isListening = true;
          recvState = 'WAITING_CNG';
          listenBtn.disabled = true;
          sendAnswerBtn.disabled = false;
          stopListenBtn.disabled = false;
          setRecvStatus('LISTENING FOR CALLING TONE', 'WAITING FOR SENDER CNG (1100/1300HZ) OR TAP SEND ANSWER TONE.');

          listenTimer = setInterval(pollMicrophone, Math.round(SYMBOL_SEC * 1000));
        } catch (err) {
          setRecvStatus('MIC ACCESS DENIED', 'ALLOW MICROPHONE PERMISSION TO RECEIVE ACOUSTIC FAX.');
        }
      });

      sendAnswerBtn.addEventListener('click', async () => {
        if (!isListening) return;
        await emitReceiverConnectionTone();
      });

      function stopListening() {
        isListening = false;
        recvState = 'IDLE';
        if (listenTimer) {
          clearInterval(listenTimer);
          listenTimer = null;
        }
        if (recvMicSource) {
          try { recvMicSource.disconnect(); } catch (_) {}
          recvMicSource = null;
        }
        if (recvMicStream) {
          recvMicStream.getTracks().forEach((t) => t.stop());
          recvMicStream = null;
        }
        recvAnalyser = null;
        listenBtn.disabled = false;
        sendAnswerBtn.disabled = true;
        stopListenBtn.disabled = true;
        setRecvStatus('IDLE', 'MICROPHONE STOPPED.');
      }

      stopListenBtn.addEventListener('click', stopListening);

      savePngBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'voice-fax-received.png';
        link.href = recvCanvas.toDataURL('image/png');
        link.click();
      });

      printBtn.addEventListener('click', () => {
        window.print();
      });
    })();
  </script>
</body>
</html>
